[project]
name = "uagent"
version = "0.1.0"
description = "React/Figma Make to LVGL/AiBuilder compiler"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "httpx>=0.28", "python-multipart>=0.0.20", "uvicorn>=0.34", "pydantic>=2.10", "pywebview>=6.1"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "adapters*", "generator*", "server*"]
exclude = ["frontend*", "tests*", "workspaces*"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
